# Publishes V2 to a fixed subpath while preserving the legacy homepage.
name: Publish V2 preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-clean
    paths:
      - ".github/workflows/publish-v2-preview.yml"
      - "v2/**"

permissions:
  contents: write

concurrency:
  group: publish-v2-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2 source
        uses: actions/checkout@v4
        with:
          ref: v2-clean
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: source/v2
        run: pnpm install --no-frozen-lockfile

      - name: Build V2 for GitHub Pages
        working-directory: source/v2
        run: |
          pnpm --filter @geo/domain build
          pnpm --filter @geo/db build
          pnpm --filter @geo/web exec tsc -b
          pnpm --filter @geo/web exec vite build --base /GEO-final-0924/v2-preview/

      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Update only the V2 preview directory
        run: |
          rm -rf site/v2-preview
          cp -R source/v2/apps/web/dist site/v2-preview
          touch site/v2-preview/.nojekyll

      - name: Commit published V2
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-preview
          if git diff --cached --quiet; then
            echo "No preview changes to publish."
          else
            git commit -m "publish V2 preview"
            git push origin HEAD:main
          fi
